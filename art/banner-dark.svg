<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="120" y1="160" x2="440" y2="440">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#1A2540"/></pattern></defs>
  <rect width="1200" height="300" fill="#0B1220"/>
  <rect x="800" width="400" height="300" fill="url(#dots)"/>
  <g transform="translate(56 50) scale(0.390625)">
  <rect x="3" y="3" width="506" height="506" rx="110" fill="url(#ibg)" stroke="#24314D" stroke-width="6"/>
  <!-- admin window -->
  <rect x="78" y="104" width="340" height="276" rx="30" fill="#111C33" stroke="#475569" stroke-width="14"/>
  <path d="M78 156 H418" stroke="#475569" stroke-width="12"/>
  <circle cx="114" cy="130" r="9" fill="#64748B"/><circle cx="142" cy="130" r="9" fill="#64748B"/><circle cx="170" cy="130" r="9" fill="#64748B"/>
  <!-- embedded app frame -->
  <rect x="122" y="192" width="252" height="148" rx="20" fill="#0B1220" stroke="url(#acc)" stroke-width="16"/>
  <!-- session token: header.payload.signature -->
  <rect x="156" y="252" width="44" height="26" rx="13" fill="#94A3B8"/>
  <circle cx="214" cy="265" r="6" fill="#F9A8D4"/>
  <rect x="228" y="252" width="64" height="26" rx="13" fill="#CBD5E1"/>
  <circle cx="306" cy="265" r="6" fill="#F9A8D4"/>
  <rect x="320" y="252" width="22" height="26" rx="11" fill="#EC4899"/>
  <!-- verified -->
  <path d="M400 312 L462 336 V384 C462 424 436 450 400 466 C364 450 338 424 338 384 V336 Z" fill="url(#acc)" stroke="#0B1220" stroke-width="12" stroke-linejoin="round"/>
  <path d="M374 390 L394 410 L428 372" fill="none" stroke="#0B1220" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="290" y="122" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">shopify-app-tanstack-start</text>
  <text x="292" y="170" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">Embedded Shopify apps on <tspan fill="#F472B6" font-weight="600">TanStack Start</tspan>: auth, webhooks, app proxy, billing</text>
  <g font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="292" y="204" width="190" height="36" rx="18" fill="#111C33" stroke="#1E2A44"/><text x="387" y="228" text-anchor="middle" fill="#F472B6">for TanStack Start</text>
    <rect x="494" y="204" width="290" height="36" rx="18" fill="#111C33" stroke="#1E2A44"/><text x="639" y="228" text-anchor="middle" fill="#CBD5E1">session tokens + token exchange</text>
    <rect x="796" y="204" width="270" height="36" rx="18" fill="#111C33" stroke="#1E2A44"/><text x="931" y="228" text-anchor="middle" fill="#CBD5E1">mirrors the React Router kit</text>
  </g>
  <text x="1170" y="280" text-anchor="end" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#64748B">Community package. Not affiliated with or endorsed by Shopify.</text>
</svg>
